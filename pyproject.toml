[project]
name = "Free_time_survey"
version = "0.1.0"
description = "Məktəblilərin boş vaxtlarını necə keçirdiyini öyrənən sorğu layihəsi"
readme = "README.md"
authors = [{ name = "Suleyman Kamilli", email = "suleymankamilli77@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.4",
]

[tool.mypy]
python_executable = ".venv/bin/python"

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
survey = "free_time_survey:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
